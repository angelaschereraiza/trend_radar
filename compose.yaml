services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trend_radar}
      POSTGRES_USER: ${DB_USER:-trend_radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trend_radar}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trend_radar} -d ${DB_NAME:-trend_radar}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
